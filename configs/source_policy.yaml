# Source policy / motion prior — Phase 2 confirmed selection
# Rule: a repo with training code is NOT a checkpoint until artifact is verified.

selection_status: confirmed_provisional
selected_candidate: xr_teleoperate_sim_scripted_demos
selection_rationale: >
  dex3_rl_manipulation repository unavailable (404). xr_teleoperate cloned but ships
  no bundled pick-place cylinder episodes. Stage A uses sim-recorded demonstrations
  in xr_teleoperate-compatible data.json format. Unitree G1_Dex3_ObjectPlacement_Dataset
  on HuggingFace retained as reference motion prior (different task).

primary_source:
  name: xr_teleoperate demonstration replay (sim-recorded)
  repository:
    url: https://github.com/unitreerobotics/xr_teleoperate
    license: Apache-2.0
    local_path: external/xr_teleoperate
    commit: 845b25a32f7febedf220e830952a7134897adb9d
  artifact_type: demonstration_trajectory
  artifact_path: checkpoints/stage_A/demos/pick_place_cylinder/episode_0001/data.json
  embodiment: "Unitree G1 29DoF + Dex3"
  task: "Isaac-PickPlace-Cylinder-G129-Dex3-Joint"
  observation_space: "robot_joint_state (29 body) + robot_gipper_state (14 Dex3) + camera_image"
  action_space: "JointPositionAction offset (43 joints, use_default_offset=True)"
  control_frequency_hz: 100.0
  sim_integration: >
    Joint replay via scripts/phase2/evaluate_stage_a.py;
    native sim_main replay: sim_main.py --replay_data --file_path <demo_dir> --enable_dex3_dds
  checkpoint_status: not_applicable
  notes: >
    Demos generated by scripts/phase2/record_demo.py using corrected Dex3 joint limits.
    Replace with real XR teleop recordings when hardware available.

reference_datasets:
  - name: G1_Dex3_ObjectPlacement_Dataset
    url: https://huggingface.co/datasets/unitreerobotics/G1_Dex3_ObjectPlacement_Dataset
    format: lerobot_parquet
    episodes: 210
    verdict: reference_only_different_task

candidates:
  - rank: 1
    name: xr_teleoperate
    url: https://github.com/unitreerobotics/xr_teleoperate
    artifact_type: demonstration_dataset
    checkpoint_available: false
    compatible_sim: unitree_sim_isaaclab
    verdict: selected

  - rank: 2
    name: dex3_rl_manipulation
    url: https://github.com/PabloKevin/dex3_rl_manipulation
    artifact_type: rl_policy_checkpoint
    checkpoint_available: false
    compatible_sim: Isaac Lab (G1 Dex3)
    verdict: unavailable_404
    notes: Repository not found during Phase 2 clone attempt.

  - rank: 3
    name: G1_Dex3_ObjectPlacement_Dataset
    url: https://huggingface.co/datasets/unitreerobotics/G1_Dex3_ObjectPlacement_Dataset
    artifact_type: lerobot_dataset
    checkpoint_available: true
    compatible_sim: indirect
    verdict: reference_motion_prior

stage_A_plan:
  method: scripted_pick_place_with_xr_json_export
  task: Isaac-PickPlace-Cylinder-G129-Dex3-Joint
  eval_config: configs/stage_a_eval.yaml
  min_configurations: 3
  trials_per_config: 10
  metrics:
    - task_success_rate
    - object_drops
    - completion_time_s
    - max_joint_delta
    - lift_delta_m

fields_completed_in_phase_2:
  - exact_commit_or_release
  - dataset_path_on_legion
  - observation_dimensions
  - action_dimensions
  - control_frequency_hz
  - license_string
